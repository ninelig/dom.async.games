<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess My Number!</title>
    <link rel="stylesheet" href="assets/style.css">
    <script src="index.js"> </script>
</head>
<body>
    <div id="main-container"> 
        <section id="top-section">
            <div style="display:flex; justify-content: space-between;"> 
                <button id="againBtn" class="btn">Again!</button>
                <h5> (Between 1 and 20) </h5>
            </div>
           <h1 id="page-title"> Guess My Number</h1> 
           <div id="secretNumberContainer">
            ?
        </div>
        </section>

        <section id="main-section" class="row align-items-center">
            <div class="text-center">
                <p style="margin-bottom: 50px;">
                    <input id="guessNumberInput" type="number" min="1" max="20">
                </p>
                <p>
                    <button id="checkBtn" class="btn">Check!</button>
                </p>

            </div>   
            <div>
                <p id="message" style="margin-bottom: 50px;"> start Guessing... </p>

                <p> Score: <span id="score">20</span> </p>
                <p> Highscore: <span id="highscore">0</span> </p>
            </div>    
        </section>

    </div>

</body>
</html>
